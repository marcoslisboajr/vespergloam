    <h1 class="disp" style="font-size:clamp(26px,6vw,44px);color:var(--bone)">${foe.name}</h1>
    ${foe.caco?`<div class="tag" style="margin:6px 0 4px;color:var(--ichor);border-color:var(--ichor-deep)">Caco: ${foe.caco}</div>`:""}
    <p class="line flavor" style="max-width:480px">${foe.flavor}</p>
    ${line?`<p class="line" style="max-width:480px;color:var(--bone);font-style:italic;margin-top:-8px">${line}</p>`:""}
    <div style="max-width:320px;margin:20px auto 0">
      <button class="btn danger gold" id="fight"><span class="k disp">ENFRENTAR</span>
        <span class="sub">Não há como recuar. Nunca houve.</span></button></div></div>`);
  document.getElementById("fight").onclick=()=>{SFX.boss();startCombat(fl.foe,false);};
}

const ENDINGS={
 sentar:{t:"A ORDEM PERPÉTUA",txt:"Sentas. O trono aceita-te como aceitou o anterior: completamente, e para sempre. A ordem volta, o crepúsculo estabiliza, nada mais morre — nem tu. Um dia perceberás o que o Soberano percebeu. Há tempo. Há apenas tempo."},
 devorar:{t:"A BOCA SEM FUNDO",txt:"Comes. O caco desce como uma promessa. A fome que chega logo depois é maior que o trono, maior que o mundo — e o mundo, prestativo, cabe todo na boca."},
 apagar:{t:"O ÚLTIMO MINGUANTE",txt:"Voltas ao Vestíbulo e apagas Sétima com dois dedos. Ela agradece — sempre soube. A morte, enfim liberta, percorre Vespergloam como uma maré mansa apagando nomes. Tudo pode acabar. Portanto, tudo pode começar."},
 decreto:{t:"O DECRETO CUMPRIDO", hidden:true, txt:"Ergues a Chave de Sal e ela não serve ao trono — serve a ti. Doze versos para descobrir a única coisa que ninguém na corte suportou ler: que o teu deus não foi assassinado. Ele pediu licença. E vós, todos vós, dissestes que não.<br><br>Não sentas. Não devoras. Não apagas vela nenhuma — a vela nunca foi o problema. O que resta do Soberano em ti — porque há sempre um caco, Vestígio, e o teu chamava-se teimosia — tu soltas. Simplesmente soltas.<br><br>A ordem para de te segurar. O Icor esfria nos veios como devia ter esfriado há eras. Sepulcra dorme. O Coro cala-se a meio da nota. Nerith deita os filhos. Ostraga larga o muro e a maré, enfim, entra — mansa, atrasada, educada. Vaskarion abre a mão.<br><br>E Vespergloam acaba. Não em fogo, não em glória: em alívio. O último decreto do Soberano Pálido, cumprido pela única pessoa que se deu ao trabalho de o ler até ao fim.<br><br><i>«Deixem-me acabar», dissera ele, «para que possais.»</i><br><br>Podeis."},
};
function victoryScreen(){
  render(`<div class="epitaph">
    <div class="candle"></div>
    <div class="word win disp" style="font-size:clamp(34px,9vw,72px)">A MÃO<br>SOLTA O TRONO</div>
    <p class="line flavor">Vaskarion se desfaz em icor dourado, dedo por dedo. O trono do Soberano Pálido está,
      pela primeira vez em eras, ao alcance de alguém. O problema de estar ao alcance é que agora a escolha é tua.</p>
    <div class="fl-lbl">A Escolha do Trono</div>
    <div class="nodegrid three" style="max-width:760px;margin:0 auto;text-align:left">
      <button class="node" data-end="sentar"><div class="nt disp"><span class="ic-dot d-wane"></span>Sentar no trono</div>
        <div class="nd">Tornar-te o novo Soberano. A ordem, de novo. O erro, de novo — mas teu.</div></button>
      <button class="node" data-end="devorar"><div class="nt disp"><span class="ic-dot d-elite"></span>Devorar o caco</div>
        <div class="nd">Engolir o que resta do deus. Que a fome decida o resto.</div></button>
      <button class="node" data-end="apagar"><div class="nt disp"><span class="ic-dot d-boss"></span>Apagar a última vela</div>
        <div class="nd">Terminar o que o Soberano começou. Deixar tudo — enfim — acabar.</div></button>
    </div>
    ${hasChave()?`<div class="fl-lbl" style="margin-top:18px;color:var(--frost)">A Chave de Sal esfria na tua mão — há uma quarta porta</div>
    <div class="nodegrid" style="max-width:520px;margin:0 auto;text-align:left">
      <button class="node" data-end="decreto" style="border-color:var(--frost);box-shadow:0 0 20px -8px var(--frost)">
        <div class="nt disp" style="color:var(--frost)"><span class="ic-dot d-wane"></span>Soltar</div>
        <div class="nd">Os doze versos ensinaram-te o que a corte inteira recusou aprender. Não há trono a tomar. Há um decreto a cumprir.</div></button>
    </div>`:`<p class="flavor" style="margin-top:16px;font-size:14px;color:var(--bone-faint)">Há uma quarta porta. Está escrita nas Escrituras Afogadas — e tu ainda não a sabes ler.</p>`}
    </div>`);
  document.querySelectorAll(".node[data-end]").forEach(b=>{
    b.onclick=()=>{
      const e=ENDINGS[b.dataset.end];
      META.endings=META.endings||{}; META.endings[b.dataset.end]=true; saveMeta();
      render(`<div class="epitaph">
        <div class="candle"></div>
        <div class="word win disp" style="font-size:clamp(26px,7vw,52px)">${e.t}</div>
        <p class="line flavor">${e.txt}</p>
        <div style="max-width:320px;margin:24px auto 0">
          <button class="btn gold" id="sum"><span class="k disp">VER O RUN</span></button></div></div>`);
      document.getElementById("sum").onclick=()=>screenSummary(true);
    };
  });
}

function screenSummary(won){
  const p=G.player;
  if(won&&!G._winCounted){ META.wins++; G._winCounted=true; saveMeta(); }
  const rows=[
    ["Desfecho",won?"A Mão soltou o trono":"Run encerrado"],
    ["Vestígio",p.name],
    ["Zona alcançada",ZONES[Math.min(G.zone,ZONES.length-1)].sub],
    ["Arma final",WEAPONS[p.weaponId].name],
    ["Selos",p.relics.length],
    ["Abates",G.kills],
    ["Mortes",G.deaths],
    ["Níveis comprados",p.levelsBought],
    ["Icor não gasto",G.icor+" ◈"],
    ["Fragmentos bancados","✦ "+G.fragEarned],
  ].map(([k,v])=>`<div><span>${k}</span><b class="ichor">${v}</b></div>`).join("");
  render(`<div class="epitaph" style="padding-top:7vh">
    <h2 class="disp ${won?'ichor':''}">${won?"A descida, por hoje, chega ao fim.":"O Claustro fica com o resto."}</h2>
    <div class="runrec">${rows}</div>
    <div style="max-width:320px;margin:20px auto 0">
      <button class="btn gold" id="vest"><span class="k disp">O VESTÍBULO</span>
        <span class="sub">Gastar fragmentos com Sétima · ✦ ${META.frag}</span></button>
      <button class="btn" id="again"><span class="k disp">NOVO VESTÍGIO</span></button>
      <button class="btn" id="title"><span class="k disp faint">TÍTULO</span></button></div></div>`);
  document.getElementById("vest").onclick=screenVestibulo;
  document.getElementById("again").onclick=screenSelect;
  document.getElementById("title").onclick=screenTitle;
}

/* ---------------- BOOT ---------------- */
const _mb=document.getElementById("mutebtn");
if(_mb)_mb.onclick=()=>{ SFX.unlock(); SFX.on=!SFX.on; _mb.classList.toggle("off",!SFX.on); if(SFX.on)SFX.ui(); };
screenTitle();
</script>
</body>
