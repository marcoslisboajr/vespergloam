<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VESPERGLOAM — O Claustro Afogado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a0b0e; --void-2:#111318;
  --stone:#14181d; --stone-2:#1b212a; --stone-3:#232b35;
  --bone:#d7d0c0; --bone-dim:#8f887a; --bone-faint:#5c5850;
  --ichor:#d9b25a; --ichor-deep:#a8813a; --ichor-glow:rgba(217,178,90,.16);
  --blood:#a5382f; --blood-deep:#63201c;
  --frost:#6d94a3; --frost-deep:#33505a;
  --bleed:#c04747; --poison:#7f9a4c; --geada:#8fb6c6;
  --edge:#2a313b; --edge-soft:#20262e;
  --font-disp:"Cinzel",Georgia,serif;
  --font-body:"EB Garamond",Georgia,serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #16130d 0%, transparent 60%),
    radial-gradient(900px 900px at 80% 120%, #0d1418 0%, transparent 55%),
    var(--void);
  color:var(--bone); font-family:var(--font-body); font-size:18px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{max-width:960px;margin:0 auto;min-height:100vh;padding:22px 18px 60px;position:relative}
.disp{font-family:var(--font-disp);letter-spacing:.04em}
.mono{font-family:var(--font-mono)}
.dim{color:var(--bone-dim)}
.faint{color:var(--bone-faint)}
.ichor{color:var(--ichor)}
.flavor{font-style:italic;color:var(--bone-dim);line-height:1.55}
h1,h2,h3{font-family:var(--font-disp);font-weight:600;letter-spacing:.05em;color:var(--bone)}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:focus-visible{outline:2px solid var(--ichor);outline-offset:2px}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);margin:16px 0}

/* ---- generic action buttons ---- */
.btn{
  display:block;width:100%;text-align:left;padding:13px 16px;margin:8px 0;
  background:linear-gradient(180deg,var(--stone-2),var(--stone));
  border:1px solid var(--edge);border-radius:2px;color:var(--bone);
  transition:.14s; position:relative; font-size:17px;
}
.btn:hover:not(:disabled){border-color:var(--ichor-deep);background:linear-gradient(180deg,#222933,var(--stone-2));transform:translateX(3px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn .k{font-family:var(--font-disp);letter-spacing:.03em}
.btn .sub{display:block;font-size:14.5px;color:var(--bone-dim);font-style:italic;margin-top:3px}
.btn .cost{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:13px;color:var(--frost)}
.btn.gold{border-color:var(--ichor-deep)}
.btn.gold:hover:not(:disabled){box-shadow:0 0 18px -6px var(--ichor)}
.btn.danger:hover:not(:disabled){border-color:var(--blood)}

.center{text-align:center}
.pad{padding:24px 8px}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-dim);border:1px solid var(--edge);
  padding:3px 9px;border-radius:2px}

/* ---- title ---- */
.title-wrap{text-align:center;padding-top:8vh}
.title-wrap .game{font-family:var(--font-disp);font-weight:700;font-size:clamp(38px,9vw,72px);
  letter-spacing:.16em;color:var(--bone);
  text-shadow:0 0 40px var(--ichor-glow); margin-bottom:2px}
.title-wrap .sub{font-family:var(--font-disp);letter-spacing:.34em;font-size:13px;
  color:var(--ichor-deep);text-transform:uppercase}
.title-wrap .epigraph{max-width:520px;margin:34px auto 40px;font-style:italic;color:var(--bone-dim)}
.candle{width:2px;height:46px;margin:0 auto 26px;background:linear-gradient(var(--ichor),transparent);
  border-radius:2px;position:relative;filter:drop-shadow(0 0 8px var(--ichor))}
.candle::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:8px;height:12px;background:radial-gradient(circle at 50% 60%,#fff2cf,var(--ichor) 55%,transparent 75%);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick 2.6s infinite}
@keyframes flick{0%,100%{transform:translateX(-50%) scale(1);opacity:.95}
  50%{transform:translateX(-52%) scale(1.12,.92);opacity:.75}}

/* ---- class select ---- */
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr 1fr}}
.card{border:1px solid var(--edge);background:linear-gradient(180deg,var(--stone-2),var(--stone));
  padding:18px 16px;border-radius:2px;transition:.16s;cursor:pointer;text-align:left}
.card:hover,.card:focus-visible{border-color:var(--ichor-deep);transform:translateY(-3px);
  box-shadow:0 10px 30px -18px var(--ichor)}
.card h3{font-size:20px;margin-bottom:2px}
.card .role{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--frost);margin-bottom:10px}
.card .desc{font-style:italic;color:var(--bone-dim);font-size:15px;min-height:66px}
.card .stats{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:12px;font-family:var(--font-mono);font-size:12px}
.card .stats span{color:var(--bone-dim)}
.card .stats b{color:var(--bone);font-weight:600}

/* ---- HUD / bars ---- */
.bar{height:9px;background:#0c0e12;border:1px solid var(--edge-soft);border-radius:2px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;transition:width .35s}
.bar.hp>i{background:linear-gradient(90deg,var(--blood-deep),var(--blood))}
.bar.poise>i{background:linear-gradient(90deg,#4a463c,var(--ichor-deep))}
.bar.focus>i{background:linear-gradient(90deg,var(--frost-deep),var(--frost))}
.bar.bleed>i{background:var(--bleed)}
.bar.poison>i{background:var(--poison)}
.bar.geada>i{background:var(--geada)}
.barlbl{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;
  color:var(--bone-dim);margin:9px 0 3px;letter-spacing:.04em}

/* ---- combat ---- */
.arena{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
.combatant{border:1px solid var(--edge);background:var(--stone);padding:15px 16px;border-radius:2px;position:relative}
.combatant.foe{border-color:#2f2622;background:linear-gradient(180deg,#191411,var(--stone))}
.combatant .name{font-family:var(--font-disp);font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.combatant .name small{font-family:var(--font-mono);font-size:12px;color:var(--bone-dim);letter-spacing:.06em}
.intent{margin-top:11px;font-size:15px;font-style:italic;color:var(--bone-dim);
  border-left:2px solid var(--edge);padding-left:10px}
.intent b{color:var(--blood);font-style:normal;font-family:var(--font-disp);font-size:13px;letter-spacing:.05em}
.intent.stagger b{color:var(--ichor)}
.statuschips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:2px;border:1px solid var(--edge)}
.chip.poison{color:var(--poison);border-color:#3a4a24}
.chip.geada{color:var(--geada);border-color:#33505a}
.chip.bleed{color:var(--bleed);border-color:#5a2626}
.chip.buff{color:var(--ichor);border-color:var(--ichor-deep)}

.ap-track{display:flex;gap:6px;margin:2px 0 4px}
.ap-pip{width:16px;height:16px;border:1px solid var(--ichor-deep);border-radius:50%;background:transparent}
.ap-pip.on{background:radial-gradient(circle,#fff2cf,var(--ichor) 60%);box-shadow:0 0 8px var(--ichor)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
.act{padding:11px 13px;border:1px solid var(--edge);background:linear-gradient(180deg,var(--stone-2),var(--stone));
  border-radius:2px;text-align:left;transition:.13s;position:relative}
.act:hover:not(:disabled){border-color:var(--ichor-deep);transform:translateY(-2px)}
.act:disabled{opacity:.34;cursor:not-allowed}
.act .an{font-family:var(--font-disp);font-size:15px}
.act .ad{font-size:13px;color:var(--bone-dim);font-style:italic}
.act .ap{position:absolute;right:11px;top:11px;font-family:var(--font-mono);font-size:12px;color:var(--frost)}
.act.crit{border-color:var(--ichor);box-shadow:0 0 16px -6px var(--ichor)}
.act.end{grid-column:1/-1;text-align:center;color:var(--bone-dim)}

.log{margin-top:16px;border-top:1px solid var(--edge-soft);padding-top:12px;
  max-height:190px;overflow-y:auto;font-size:15.5px}
.log p{margin:5px 0;color:var(--bone-dim);animation:fade .3s}
.log p.hit{color:var(--bone)}
.log p.crit{color:var(--ichor);font-style:italic}
.log p.hurt{color:var(--blood)}
.log p.proc{color:var(--bleed)}
.log p.sys{color:var(--bone-faint);font-style:italic}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.float{position:fixed;pointer-events:none;font-family:var(--font-mono);font-weight:600;
  font-size:20px;animation:rise 1s forwards;z-index:50;text-shadow:0 1px 4px #000}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.8)}
  20%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-40px)}}

/* ---- map ---- */
.floor{border:1px solid var(--edge-soft);border-radius:2px;padding:12px;margin:10px 0;
  background:linear-gradient(180deg,rgba(27,33,42,.5),transparent)}
.floor .fl-lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--bone-faint);text-transform:uppercase;margin-bottom:8px}
.nodegrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.nodegrid.two{grid-template-columns:1fr 1fr}.nodegrid.three{grid-template-columns:1fr 1fr 1fr}}
.node{border:1px solid var(--edge);background:var(--stone);padding:12px 14px;border-radius:2px;text-align:left;transition:.14s}
.node:hover:not(:disabled){border-color:var(--ichor-deep);transform:translateY(-2px)}
.node:disabled{opacity:.4}
.node .nt{font-family:var(--font-disp);font-size:15px;display:flex;align-items:center;gap:8px}
.node .nd{font-size:13px;color:var(--bone-dim);font-style:italic;margin-top:3px}
.node.done{opacity:.45;border-style:dashed}
.node.mancha{border-color:var(--ichor);box-shadow:0 0 18px -8px var(--ichor)}
.ic-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.d-combat{background:var(--blood)} .d-elite{background:var(--bleed)}
.d-wane{background:var(--ichor);box-shadow:0 0 7px var(--ichor)} .d-treasure{background:var(--frost)}
.d-merchant{background:var(--poison)} .d-boss{background:#fff;box-shadow:0 0 8px var(--blood)}

.hud-top{display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--edge-soft);padding-bottom:12px;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.hud-top .who{font-family:var(--font-disp);font-size:16px}
.hud-top .who small{color:var(--bone-dim);font-family:var(--font-body);font-style:italic}
.res{display:flex;gap:16px;font-family:var(--font-mono);font-size:14px;align-items:center}
.res .icor{color:var(--ichor)} .res .flask{color:var(--blood)}

/* ---- wane ---- */
.wane-hero{text-align:center;padding:14px 0 6px}
.attr-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
  border:1px solid var(--edge-soft);border-radius:2px;margin:6px 0;background:var(--stone)}
.attr-row .an{font-family:var(--font-disp);font-size:15px}
.attr-row .av{font-family:var(--font-mono);font-size:16px;color:var(--ichor);min-width:34px;text-align:right}
.attr-row .plus{padding:6px 14px;border:1px solid var(--ichor-deep);border-radius:2px;
  font-family:var(--font-mono);font-size:13px;color:var(--ichor);transition:.13s}
.attr-row .plus:hover:not(:disabled){background:var(--ichor-glow)}
.attr-row .plus:disabled{opacity:.35;cursor:not-allowed}
.attr-row .eff{font-size:12px;color:var(--bone-faint);font-style:italic}

/* ---- death / victory ---- */
.epitaph{text-align:center;padding-top:10vh}
.epitaph .word{font-family:var(--font-disp);font-weight:700;font-size:clamp(46px,12vw,96px);
  letter-spacing:.2em;color:var(--blood);text-shadow:0 0 60px rgba(165,56,47,.4)}
.epitaph .word.win{color:var(--ichor);text-shadow:0 0 60px var(--ichor-glow)}
.epitaph .line{margin:22px auto 30px;max-width:440px;font-style:italic;color:var(--bone-dim)}
.runrec{font-family:var(--font-mono);font-size:13px;color:var(--bone-dim);margin:18px auto;max-width:340px}
.runrec div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--edge-soft)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--stone-2);border:1px solid var(--ichor-deep);padding:10px 20px;border-radius:2px;
  font-family:var(--font-disp);font-size:14px;letter-spacing:.04em;color:var(--ichor);
  box-shadow:0 8px 30px -10px #000;animation:fade .3s;z-index:60}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   VESPERGLOAM — vertical slice
   BuriedBornes-style turn combat + Elden Ring stats/scaling/runes
   Single file, no deps.  © Elzerath Studio (protótipo)
   ============================================================ */

/* ---------------- CONSTANTES E DADOS ---------------- */
const SCALE = { S:1.0, A:.75, B:.55, C:.4, D:.25, E:.1, "—":0 };

const ATTRS = [
  { k:"vit", name:"Vitalidade", eff:"vida" },
  { k:"fol", name:"Fôlego",     eff:"ações e postura" },

// ---- Armas ----

// ---- Habilidades / Artes de arma ----
const SKILLS = {

    desc:"Avanço que quebra guarda e postura. Feito para derrubar." },
  retalho:{ name:"Dança do Retalho", ap:3, foco:2, kind:"phys", hits:3, mult:.6, poise:5, build:{bleed:16},

    desc:"Um pedido de clemência que arde. Restaura vida." },
};

// ---- Vestígios (classes) ----
const VESTIGES = [
  { id:"ferro", name:"Lâmina de Ferro", role:"Guardião", weapon:"cinzalamina",
    skills:["investida"], flasks:3,
    desc:"Morreu de pé, defendendo um portão que já não existe. O hábito ficou.",
    base:{vit:16,fol:12,for:16,des:9,int:6,fe:8,sin:7} },
  { id:"presa", name:"Presa Pálida", role:"Algoz", weapon:"presas",
    skills:["retalho"], flasks:2,
    desc:"Rápida, faminta, sem paciência para armaduras. Deixa o sangue trabalhar.",
    base:{vit:11,fol:14,for:8,des:17,int:7,fe:6,sin:14} },
  { id:"cinza", name:"Voz das Cinzas", role:"Herege", weapon:"vara",
    skills:["fragmento","chama"], flasks:2,
    desc:"Aprendeu a feitiçaria decorando os últimos gritos do Soberano. Frágil, mas certeira.",
    base:{vit:10,fol:11,for:6,des:8,int:17,fe:14,sin:8} },
];

// ---- Inimigos ----
const FOES = {
  servo:{ name:"Servo Afogado", hp:52, def:2, poise:20, icor:34,
    moves:[
      {n:"golpe inchado", tell:"Ergue um braço encharcado.", dmg:9, poise:8},
      {n:"agarrão", tell:"Estende as mãos, faminto.", dmg:12, poise:6},
    ],
    flavor:"O Claustro afogou-o há tempos. Ele não percebeu." },
  larva:{ name:"Larva de Icor", hp:38, def:1, poise:12, icor:28,
    moves:[
      {n:"cuspe séptico", tell:"Incha, prestes a arrotar.", dmg:6, poise:3, build:{poison:30}},
      {n:"mordida", tell:"Range as gengivas.", dmg:8, poise:4},

  carniceiro:{ name:"Carniceiro do Ossuário", hp:88, def:4, poise:40, icor:62,
    moves:[
      {n:"talho largo", tell:"Arma o cutelo bem alto — golpe pesado.", dmg:20, poise:16, heavy:true},
      {n:"empurrão", tell:"Avança o ombro.", dmg:10, poise:10},
      {n:"recompor", tell:"Respira fundo, firmando a guarda.", block:true, poise:0},
    ],
    flavor:"Cortava carne antes. Ainda corta. Mudaram só os cortes." },
  sentinela:{ name:"Sentinela de Cinza", hp:74, def:6, poise:34, icor:58,
    moves:[
      {n:"lâmina gélida", tell:"A lâmina cobre-se de geada.", dmg:13, poise:8, build:{geada:34}},

    moves:[

      {n:"terra nos olhos", tell:"Junta um punhado de terra fria.", dmg:8, poise:5, build:{geada:22}},
      {n:"cava fundo", tell:"Prepara um golpe descendente — devastador.", dmg:34, poise:26, heavy:true, wind:true},

    flavor:"Cava covas há eras. A tua já está pronta; ele só espera educadamente." },
  sepulcra:{ name:"Sepulcra, a Primeira Vigília", hp:210, def:6, poise:60, icor:0, boss:true,
    moves:[
      {n:"foice em arco", tell:"Descreve um arco largo com a foice.", dmg:18, poise:14},
      {n:"flor de sangue", tell:"Gira a lâmina numa flor de cortes.", dmg:10, poise:8, hits:2, build:{bleed:24}},
      {n:"«cava tua cova»", tell:"Ergue a foice ao teto apodrecido — golpe fatal.", dmg:40, poise:30, heavy:true, wind:true},
      {n:"vigília", tell:"Recolhe-se sob o manto, refazendo a guarda.", block:true},
    ],
    phase2:{ hpAt:.5, msg:"Sepulcra despe o manto. O frio da Maré Baixa preenche a sala.",
      add:{n:"lamento gélido", tell:"O ar congela ao redor — geada iminente.", dmg:16, poise:10, build:{geada:40}} },
    flavor:"A primeira a morrer defendendo o Minguante. A última a aceitar que falhou." },

// ---- Textos de sabor ----
const DEATHS = [
  "A morte, como sempre, chegou pontual.",
  "Vespergloam mal notou. Já viu tantos.",
  "O Icor esfria. Alguém virá recolhê-lo. Não serás tu — por ora.",
  "Não foi bravura. Foi teimosia. A diferença raramente sobrevive.",
  "O Claustro afoga mais um nome. Não guardava os anteriores.",

/* ---------------- UTIL ---------------- */
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri  = (a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),1900);
}
function floatText(txt,color){
  const el=document.createElement("div");el.className="float";el.textContent=txt;
  el.style.color=color||"var(--bone)";
  el.style.left=(30+Math.random()*40)+"%";el.style.top=(38+Math.random()*10)+"%";
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}

/* ---------------- STATS DERIVADOS ---------------- */
function maxHP(a){ return 45 + a.vit*11; }
function maxAP(a){ return clamp(3 + Math.floor(a.fol/7), 3, 7); }
function maxPoise(a){ return 30 + a.fol*2 + a.for; }
function maxFoco(a){ return 4 + Math.floor((a.int+a.fe)/6); }
function flaskHeal(a){ return Math.round(maxHP(a)*0.42) + a.fe*2; }

function weaponAtk(attr, w){
  let dmg = w.base, foc=0;
  for(const s in w.scale){ dmg += SCALE[w.scale[s]] * attr[s] * 0.8; }
  return Math.round(dmg);
}
function skillAtk(attr, w, sk){
  // base física usa a arma; feitiçaria escala pelo atributo indicado
  let base;
  if(sk.kind==="sorcery"){ base = (w.base*0.5) + SCALE["A"]*attr[sk.scale]*0.9; }
  else { base = weaponAtk(attr,w); }
  return Math.round(base * (sk.mult||1));
}

/* ---------------- CONSTRUÇÃO DO PERSONAGEM ---------------- */
function makePlayer(vestige){
  const attr = {...vestige.base};
  const p = {
    name:vestige.name, vestige:vestige.id, attr,
    weaponId:vestige.weapon, skills:[...vestige.skills],
    invWeapons:[vestige.weapon],
    levelsBought:0,
  };
  p.hp = maxHP(attr); p.foco = maxFoco(attr);
  p.flaskMax = vestige.flasks; p.flask = vestige.flasks;
  return p;
}

function lootLabel(loot){
  const [t,v]=loot.split(":");
  if(t==="weapon") return "Uma arma jaz entre os ossos: "+WEAPONS[v].name+".";
  if(t==="icor")   return v+" de Icor esquecido no lodo.";
  return "Restos aproveitáveis.";
}

function resolveNode(floor, idx){
  const node = G.map[floor].choices[idx];
  G._pendingNode = {floor, idx};
  if(node.t==="treasure"){ resolveTreasure(node); return; }
  startCombat(node.foe, node.t==="elite");
}

function resolveTreasure(node){
  const [t,v]=node.loot.split(":");
  let msg="";
  if(t==="icor"){ G.icor+= +v; msg=`Recolhes ${v} de Icor. Ainda morno.`; }
  else if(t==="weapon"){
    if(!G.player.invWeapons.includes(v)) G.player.invWeapons.push(v);
    msg=`Empunhas ${WEAPONS[v].name}. «${WEAPONS[v].desc}»`;
  }
  markCleared();
  render(`${hudTop()}
    <div class="floor" style="margin-top:20px">
      <div class="nt disp ichor"><span class="ic-dot d-treasure"></span>Tesouro</div>
      <p class="flavor" style="margin-top:10px;color:var(--bone);font-style:normal">${msg}</p>

    ${t==="weapon"?`<p class="center flavor">Podes trocar de arma no próximo Minguante — ou já a seguir, se quiseres.</p>`:""}

    document.getElementById("equip").onclick=()=>{ G.player.weaponId=v; toast("Arma empunhada: "+WEAPONS[v].name); advanceFloor(); };
  }
  document.getElementById("cont").onclick=advanceFloor;
}

function markCleared(){
  if(G._pendingNode){ G.clearedNodes[G._pendingNode.floor+":"+G._pendingNode.idx]=true; }
}
function advanceFloor(){
  // reaver mancha ao vencer o nó onde morreste
  if(G.mancha && G.mancha.floor===G.floor){
    G.icor += G.mancha.amount;
    toast(`Reavido: ${G.mancha.amount} ◈ de Icor`);
    G.mancha=null;
  }
  G.floor++;
  screenMap();
}

function startCombat(foeId, isElite){
  const base = FOES[foeId];
  const foe = {
    id:foeId, name:base.name, hp:base.hp, maxHp:base.hp, def:base.def,
    poise:base.poise, maxPoise:base.poise, staggered:false, blocking:false,
    icor:base.icor, moves:base.moves.map(m=>({...m})), boss:base.boss, elite:base.elite,
    phase2:base.phase2?{...base.phase2, done:false}:null,
    status:{bleed:0,poison:0,geada:0}, statusMax:{bleed:100,poison:100,geada:100},
    poisonTurns:0, geadaTurns:0, intent:null,
  };
  const p=G.player, a=p.attr;
  const C = {
    foe, turn:"player", ap:maxAP(a), over:false,
    pStatus:{bleed:0,poison:0,geada:0}, pStatusMax:{bleed:100,poison:100,geada:100},
    pPoise:maxPoise(a), pMaxPoise:maxPoise(a), pStaggered:false,
    pPoisonTurns:0, pGeadaTurns:0, pGeadaDebuff:false, pFoco:p.foco,
    log:[], guarding:false,
  };
  G.combat=C;
  chooseIntent(foe);
  clog(C, `<span class="sys">${base.flavor}</span>`);
  clog(C, `<span class="sys">${foe.name} ergue-se do lodo.</span>`);
  renderCombat();
}

function clog(C,msg,cls){ C.log.push(`<p class="${cls||''}">${msg}</p>`); if(C.log.length>60)C.log.shift(); }

function chooseIntent(foe){
  if(foe.staggered){ foe.intent={n:"—",tell:"Cambaleia, atordoado.",stagger:true}; return; }
  // fase 2 do chefe
  if(foe.phase2 && !foe.phase2.done && foe.hp <= foe.maxHp*foe.phase2.hpAt){
    foe.phase2.done=true; foe.moves.push(foe.phase2.add);
    foe._phaseMsg=foe.phase2.msg;
  }
  let pool=foe.moves.slice();
  // evita repetir bloqueio/recompor seguidamente
  if(foe._last && (foe._last.block)) pool=pool.filter(m=>!m.block);
  const m=pick(pool);
  foe._last=m;
  foe.intent=m;
}

function renderCombat(){
  const C=G.combat, foe=C.foe, p=G.player, a=p.attr;
  const w=WEAPONS[p.weaponId];

  const apPips = Array.from({length:maxAP(a)},(_,i)=>
    `<div class="ap-pip ${i<C.ap?'on':''}"></div>`).join("");

  // barras de status
  const foeStatus = statusChips(foe.status, foe.poisonTurns, foe.geadaTurns, foe.blocking, foe.staggered);
  const pStatus = statusChips(C.pStatus, C.pPoisonTurns, C.pGeadaTurns, C.guarding, C.pStaggered);

  // ações
  const canCrit = foe.staggered;
  const acts = buildActions(C, p, w, canCrit);

  render(`${hudTop()}
    <div class="fl-lbl" style="margin-top:4px">Combate · ${foe.elite?"Elite":foe.boss?"Chefe":"Profundidade "+G.floor}</div>
    <div class="arena">
      <!-- INIMIGO -->
      <div class="combatant foe">
        <div class="name disp">${foe.name} <small>${foe.hp}/${foe.maxHp} HP</small></div>
        <div class="barlbl"><span>VIDA</span><span>${Math.max(0,foe.hp)}</span></div>
        <div class="bar hp"><i style="width:${clamp(foe.hp/foe.maxHp*100,0,100)}%"></i></div>
        <div class="barlbl"><span>POSTURA</span><span>${Math.max(0,Math.round(foe.poise))}/${foe.maxPoise}</span></div>
        <div class="bar poise"><i style="width:${clamp(foe.poise/foe.maxPoise*100,0,100)}%"></i></div>
        ${statusBars(foe.status)}
        ${foeStatus}
        <div class="intent ${foe.staggered?'stagger':''}">
          <b>${foe.staggered?"ATORDOADO":"INTENÇÃO"}</b> — ${foe.intent?foe.intent.tell:""}
        </div>
      </div>
      <!-- JOGADOR -->
      <div class="combatant">
        <div class="name disp">${p.name} <small>${w.name}</small></div>
        <div class="barlbl"><span>VIDA</span><span>${p.hp}/${maxHP(a)}</span></div>
        <div class="bar hp"><i style="width:${clamp(p.hp/maxHP(a)*100,0,100)}%"></i></div>
        <div class="barlbl"><span>POSTURA</span><span>${Math.max(0,Math.round(C.pPoise))}/${C.pMaxPoise}</span></div>
        <div class="bar poise"><i style="width:${clamp(C.pPoise/C.pMaxPoise*100,0,100)}%"></i></div>
        <div class="barlbl"><span>FOCO</span><span>${C.pFoco}/${maxFoco(a)}</span></div>
        <div class="bar focus"><i style="width:${clamp(C.pFoco/maxFoco(a)*100,0,100)}%"></i></div>
        ${statusBars(C.pStatus)}
        ${pStatus}
      </div>
    </div>

    <div class="barlbl" style="margin-top:12px"><span>AÇÃO</span><span>${C.ap} AP restantes</span></div>
    <div class="ap-track">${apPips}</div>
    <div class="actions">${acts}</div>

    <div class="log" id="clog">${C.log.join("")}</div>`);

  // bind
  document.querySelectorAll(".act[data-act]").forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>doAction(b.dataset.act);
  });
  const lg=document.getElementById("clog"); if(lg) lg.scrollTop=lg.scrollHeight;
}

function statusBars(st){
  let h="";
  if(st.bleed>0)  h+=`<div class="barlbl" style="margin-top:6px"><span style="color:var(--bleed)">SANGUE</span><span>${Math.round(st.bleed)}%</span></div><div class="bar bleed"><i style="width:${st.bleed}%"></i></div>`;
  if(st.poison>0) h+=`<div class="barlbl" style="margin-top:6px"><span style="color:var(--poison)">VENENO</span><span>${Math.round(st.poison)}%</span></div><div class="bar poison"><i style="width:${st.poison}%"></i></div>`;
  if(st.geada>0)  h+=`<div class="barlbl" style="margin-top:6px"><span style="color:var(--geada)">GEADA</span><span>${Math.round(st.geada)}%</span></div><div class="bar geada"><i style="width:${st.geada}%"></i></div>`;
  return h;
}
function statusChips(st, poisonT, geadaT, blocking, staggered){
  const c=[];
  if(poisonT>0) c.push(`<span class="chip poison">envenenado ${poisonT}</span>`);
  if(geadaT>0)  c.push(`<span class="chip geada">frostbite ${geadaT}</span>`);
  if(blocking)  c.push(`<span class="chip buff">guarda</span>`);
  if(staggered) c.push(`<span class="chip buff">atordoado</span>`);
  return c.length?`<div class="statuschips">${c.join("")}</div>`:"";
}

function buildActions(C, p, w, canCrit){
  const a=p.attr;
  const acts=[];
  // Golpe crítico (só com alvo atordoado)
  if(canCrit){
    acts.push(actBtn("crit","Golpe Crítico","Explora o atordoamento — dano massivo.",w.ap, C.ap>=w.ap, "crit"));
  }
  // Atacar
  acts.push(actBtn("attack",`Atacar · ${w.name}`,
    `${w.hits>1?w.hits+" golpes. ":""}${Object.entries(w.scale).map(([s,g])=>s.toUpperCase()+" "+g).join(" ")}`,
    w.ap, C.ap>=w.ap));
  // Habilidades
  p.skills.forEach(id=>{
    const sk=SKILLS[id];
    // arte de arma só disponível se a arma a suporta OU é skill de classe (feitiçaria/cura)
    const isArt = (w.art===id);
    const usable = isArt || sk.kind==="sorcery" || sk.kind==="heal";
    const catalystNeeded = sk.kind==="sorcery" && !w.catalyst;
    let ok = C.ap>=sk.ap && C.pFoco>=(sk.foco||0) && usable && !catalystNeeded;
    let d = sk.desc + (catalystNeeded?" (requer catalisador)":"");
    acts.push(actBtn("skill:"+id, sk.name, d, sk.ap, ok, null, sk.foco));
  });
  // Defender
  acts.push(actBtn("guard","Defender","Reduz o dano do próximo golpe e recupera postura.",1, C.ap>=1));
  // Frasco
  if(p.flask>0) acts.push(actBtn("flask",`Frasco de Âmago (${p.flask})`,`Cura ${flaskHeal(a)} de vida.`,2, C.ap>=2));
  // Encerrar turno
  acts.push(`<button class="act end" data-act="end"><span class="an disp">Encerrar turno ▸</span></button>`);
  return acts.join("");
}
function actBtn(act,name,desc,ap,ok,extra,foco){
  return `<button class="act ${extra||''}" data-act="${act}" ${ok?"":"disabled"}>
    <div class="an disp">${name}</div>
    <div class="ad">${desc}</div>
    <div class="ap">${ap} AP${foco?` · ${foco}⟡`:""}</div>
  </button>`;
}

/* ---- ações do jogador ---- */
function doAction(act){
  const C=G.combat, foe=C.foe, p=G.player, a=p.attr, w=WEAPONS[p.weaponId];
  if(C.over || C.turn!=="player") return;

  if(act==="end"){ endPlayerTurn(); return; }

  if(act==="guard"){
    C.ap-=1; C.guarding=true;
    C.pPoise=clamp(C.pPoise+18,0,C.pMaxPoise);
    clog(C,`<span class="sys">Ergues a guarda. Postura firmada.</span>`);
    renderCombat(); return;
  }
  if(act==="flask"){
    C.ap-=2; p.flask--;
    const h=flaskHeal(a); p.hp=clamp(p.hp+h,0,maxHP(a));
    floatText("+"+h,"var(--ichor)");
    clog(C,`<span class="hit">Bebes o Âmago. +${h} de vida.</span>`);
    renderCombat(); return;
  }
  if(act==="attack"){
    C.ap-=w.ap;
    for(let i=0;i<(w.hits||1);i++) hitFoe(C,foe,p,weaponAtk(a,w),w.poise,w.build,false);
    afterPlayerAct(); return;
  }
  if(act==="crit"){
    C.ap-=w.ap;
    clog(C,`<span class="crit">GOLPE CRÍTICO!</span>`);
    hitFoe(C,foe,p,weaponAtk(a,w),w.poise,w.build,true);
    afterPlayerAct(); return;
  }
  if(act.startsWith("skill:")){
    const sk=SKILLS[act.split(":")[1]];
    C.ap-=sk.ap; C.pFoco-=(sk.foco||0);
    if(sk.kind==="heal"){
      const h=Math.round(maxHP(a)*0.30)+a.fe*3;
      p.hp=clamp(p.hp+h,0,maxHP(a));
      floatText("+"+h,"var(--ichor)");
      clog(C,`<span class="hit">${sk.name}: a chama restaura +${h}.</span>`);
      afterPlayerAct(); return;
    }
    const hits=sk.hits||1;
    for(let i=0;i<hits;i++) hitFoe(C,foe,p,skillAtk(a,w,sk),sk.poise,sk.build,false,sk.kind==="sorcery");
    afterPlayerAct(); return;
  }
}

function hitFoe(C,foe,p,rawAtk,poiseDmg,build,isCrit,ignoreDef){
  const a=p.attr;
  let dmg=Math.round(rawAtk*rnd(.9,1.1));
  const def=ignoreDef?Math.floor(foe.def/2):foe.def;
  dmg=Math.max(1,dmg-def);
  if(foe.blocking){ dmg=Math.round(dmg*0.4); }
  if(foe.staggered) dmg=Math.round(dmg*1.75);
  if(isCrit) dmg=Math.round(dmg*2.6);
  foe.hp-=dmg;
  floatText("-"+dmg, isCrit?"var(--ichor)":"var(--bone)");
  clog(C, `<span class="${isCrit?'crit':'hit'}">Acertas ${foe.name} — ${dmg} de dano.${foe.blocking?" (bloqueado)":""}</span>`);

  // postura
  if(!foe.staggered){
    foe.poise -= poiseDmg*(1 + (isCrit?0:0));
    if(foe.poise<=0 && !foe.boss || (foe.boss && foe.poise<=0)){
      foe.poise=0; foe.staggered=true; foe.blocking=false;
      foe.intent={n:"—",tell:"Cambaleia, atordoado.",stagger:true};
      clog(C,`<span class="crit">${foe.name} perde a postura — ATORDOADO!</span>`);
    }
  }
  // status buildup
  if(build){
    const mult=1 + a.sin*0.03;
    for(const s in build){
      foe.status[s]=clamp(foe.status[s]+build[s]*mult,0,100);
      if(foe.status[s]>=100){ procStatus(C,foe,s,true); }
    }
  }
  if(foe.hp<=0){ foe.hp=0; winCombat(); }
}

function procStatus(C,ent,type,isFoe){
  const name=isFoe?ent.name:"Tu";
  if(type==="bleed"){
    const dmg=Math.round((isFoe?ent.maxHp:maxHP(G.player.attr))*0.11)+12;
    if(isFoe){ ent.hp-=dmg; } else { G.player.hp-=dmg; }
    ent.status.bleed=0;
    clog(C,`<span class="proc">SANGRAMENTO! ${name} perde ${dmg} de vida.</span>`);
    floatText("-"+dmg,"var(--bleed)");
    if(isFoe && ent.hp<=0){ ent.hp=0; winCombat(); }
  }
  if(type==="poison"){
    ent.status.poison=0;
    if(isFoe) ent.poisonTurns=3; else C.pPoisonTurns=3;
    clog(C,`<span class="proc">${name} ${isFoe?"está":"estás"} envenenado.</span>`);
  }
  if(type==="geada"){
    ent.status.geada=0;
    if(isFoe){ ent.geadaTurns=3; } else { C.pGeadaTurns=3; C.pGeadaDebuff=true; }
    clog(C,`<span class="proc">GEADA! ${name} ${isFoe?"treme de frio (dano recebido +15%)":"tremes de frio"}.</span>`);
  }
}

function afterPlayerAct(){
  const C=G.combat;
  if(C.over) return;
  if(C.ap<=0){ endPlayerTurn(); }
  else renderCombat();
}

function endPlayerTurn(){
  const C=G.combat;
  if(C.over) return;
  C.turn="foe";
  renderCombat();
  setTimeout(foeTurn, 620);
}

function foeTurn(){
  const C=G.combat; if(C.over) return;
  const foe=C.foe, p=G.player, a=p.attr;

  // fase 2 anúncio
  if(foe._phaseMsg){ clog(C,`<span class="crit">${foe._phaseMsg}</span>`); foe._phaseMsg=null; }

  // ticks de status no inimigo (início do turno dele)
  if(foe.poisonTurns>0){ const d=Math.round(foe.maxHp*0.05)+3; foe.hp-=d; foe.poisonTurns--;
    clog(C,`<span class="proc">Veneno corrói ${foe.name}: ${d} de dano.</span>`);
    if(foe.hp<=0){foe.hp=0;winCombat();return;} }
  if(foe.geadaTurns>0) foe.geadaTurns--;

  if(foe.staggered){
    clog(C,`<span class="sys">${foe.name} recompõe-se lentamente.</span>`);
    foe.staggered=false; foe.poise=Math.round(foe.maxPoise*0.6);
    chooseIntent(foe);
    startPlayerTurn(); return;
  }

  const m=foe.intent||{};
  if(m.block){
    foe.blocking=true;
    foe.poise=clamp(foe.poise+20,0,foe.maxPoise);
    clog(C,`<span class="sys">${foe.name} firma a guarda.</span>`);
  } else {
    foe.blocking=false;
    const hits=m.hits||1;
    for(let i=0;i<hits;i++) foeHit(C,foe,p,m);
  }
  // recupera postura no fim do turno
  foe.poise=clamp(foe.poise+6,0,foe.maxPoise);
  chooseIntent(foe);
  if(G.player.hp<=0){ loseCombat(); return; }
  startPlayerTurn();
}

function foeHit(C,foe,p,m){
  const a=p.attr;
  let dmg=m.dmg||0;
  // frostbite no jogador aumenta dano recebido
  if(C.pGeadaTurns>0) dmg=Math.round(dmg*1.15);
  // defender reduz
  if(C.guarding){ dmg=Math.round(dmg*0.4); }
  // postura do jogador absorve? golpes pesados quebram guarda
  dmg=Math.max(1,dmg - Math.floor(a.fol/6));
  p.hp-=dmg;
  floatText("-"+dmg,"var(--blood)");
  clog(C,`<span class="hurt">${foe.name} usa ${m.n}: ${dmg} de dano.${C.guarding?" (defendido)":""}</span>`);
  // dano de postura ao jogador
  if(!C.guarding){
    C.pPoise-=(m.poise||0);
    if(C.pPoise<=0){ C.pPoise=Math.round(C.pMaxPoise*0.5);
      clog(C,`<span class="proc">Cambaleias sob o impacto!</span>`); }
  }
  // status do inimigo no jogador
  if(m.build){
    for(const s in m.build){
      C.pStatus[s]=clamp(C.pStatus[s]+m.build[s],0,100);
      if(C.pStatus[s]>=100){ procStatus(C,{status:C.pStatus},s,false); }
    }
  }
}

function startPlayerTurn(){
  const C=G.combat, p=G.player, a=p.attr;
  C.turn="player";
  C.ap=maxAP(a);
  // frostbite: -1 AP enquanto ativo
  if(C.pGeadaTurns>0){ C.ap=Math.max(2,C.ap-1); }
  C.guarding=false;
  // regen de postura e foco
  C.pPoise=clamp(C.pPoise+10,0,C.pMaxPoise);
  C.pFoco=clamp(C.pFoco+2,0,maxFoco(a));
  // veneno no jogador tica
  if(C.pPoisonTurns>0){ const d=Math.round(maxHP(a)*0.04)+2; p.hp-=d; C.pPoisonTurns--;
    clog(C,`<span class="proc">O veneno arde: ${d} de dano.</span>`);
    floatText("-"+d,"var(--poison)");
    if(p.hp<=0){ loseCombat(); return; } }
  renderCombat();
}

/* ---- fim de combate ---- */
function winCombat(){
  const C=G.combat; if(C.over) return; C.over=true;
  const foe=C.foe;
  G.kills++;
  G.icor += foe.icor;
  markCleared();
  const p=G.player, a=p.attr;
  p.foco=maxFoco(a); // restaura foco entre combates

  if(foe.boss){ return victoryScreen(); }

  render(`${hudTop()}
    <div class="floor" style="margin-top:22px;border-color:var(--ichor-deep)">
      <div class="nt disp ichor">Vitória</div>
      <p class="flavor" style="margin-top:8px;color:var(--bone);font-style:normal">
        ${foe.name} volta ao lodo de onde veio. Recolhes <b class="ichor">${foe.icor} de Icor</b>, ainda tépido.</p>
    </div>
    <div style="max-width:320px;margin:16px auto 0">
      <button class="btn gold" id="cont"><span class="k disp">SEGUIR</span></button>
    </div>`);
  document.getElementById("cont").onclick=advanceFloor;
}

function loseCombat(){
  const C=G.combat; if(C.over) return; C.over=true;
  screenDeath();
}

/* ---- MORTE ---- */
function screenDeath(){
  G.deaths++;
  // largar Icor no chão (na profundidade atual)
  if(G.icor>0){ G.mancha={ floor:G.floor, amount:G.icor }; }
  G.icor=0;
  const line=pick(DEATHS);
  render(`
    <div class="epitaph">
      <div class="word disp">FENECESTE</div>
      <p class="line flavor">${line}</p>
      ${G.mancha?`<p class="center mono" style="color:var(--ichor);font-size:14px">Largaste ${G.mancha.amount} ◈ de Icor na profundidade ${G.mancha.floor}.</p>`:""}
      <div style="max-width:340px;margin:26px auto 0">
        <button class="btn gold" id="revive"><span class="k disp">ERGUER-SE NO MINGUANTE</span>
          <span class="sub">Voltas ao último Minguante. Os mortos abaixo também.</span></button>
        <button class="btn danger" id="quit"><span class="k disp faint">DEIXAR O CLAUSTRO</span>
          <span class="sub">Encerrar o run</span></button>
      </div>
    </div>`);
  document.getElementById("revive").onclick=revive;
  document.getElementById("quit").onclick=()=>screenSummary(false);
}

function revive(){
  const p=G.player, a=p.attr;
  p.hp=maxHP(a); p.flask=p.flaskMax; p.foco=maxFoco(a);
  // limpar nós abaixo do último Minguante (inimigos voltam)
  for(const key in G.clearedNodes){
    const f=+key.split(":")[0];
    if(f>G.lastWane) delete G.clearedNodes[key];
  }
  G.floor=G.lastWane;
  G.combat=null;
  toast("Ergues-te no Minguante.");
  screenMap();
}

/* ============================================================
                        MINGUANTE (grace)
   ============================================================ */
function screenWane(){
  const fl=G.map[G.floor];
  const p=G.player, a=p.attr;
  // registrar como último minguante e restaurar mundo
  G.lastWane=G.floor;
  p.hp=maxHP(a); p.flask=p.flaskMax; p.foco=maxFoco(a);
  // inimigos abaixo voltam (descanso reacende o Claustro)
  if(!fl._rested){
    for(const key in G.clearedNodes){
      const f=+key.split(":")[0];
      if(f>G.floor) delete G.clearedNodes[key];
    }
  }
  fl._rested=true;

  // reaver mancha se calhar aqui
  if(G.mancha && G.mancha.floor===G.floor){
    G.icor+=G.mancha.amount; toast(`Reavido: ${G.mancha.amount} ◈`); G.mancha=null;
  }

  renderWane();
}

function renderWane(){
  const p=G.player, a=p.attr;
  const line=pick(WANE_LINES);
  const attrRows=ATTRS.map(at=>{
    const cost=levelCost();
    const can=G.icor>=cost;
    return `<div class="attr-row">
      <div>
        <div class="an disp">${at.name}</div>
        <div class="eff">${at.eff} · ${derivedHint(at.k)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="av mono">${a[at.k]}</span>
        <button class="plus mono" data-at="${at.k}" ${can?"":"disabled"}>+1 · ${cost}◈</button>
      </div>
    </div>`;
  }).join("");

  const fl=G.map[G.floor];
  render(`${hudTop()}
    <div class="wane-hero">
      <div class="candle" style="height:36px"></div>
      <h2 class="disp ichor">${fl.name||"Minguante"}</h2>
      <p class="flavor" style="max-width:460px;margin:8px auto 0">${line}</p>
    </div>
    <div class="hr"></div>
    <div class="fl-lbl">Subir atributos · <span class="ichor mono">${G.icor} ◈ Icor</span> · próximo nível: ${levelCost()}◈</div>
    ${attrRows}
    ${fl.merchant?merchantBlock():""}
    <div class="hr"></div>
    <div style="max-width:340px;margin:0 auto">
      ${swapWeaponBlock()}
      <button class="btn gold" id="descend"><span class="k disp">CONTINUAR A DESCIDA</span>
        <span class="sub">Adiante. Sempre adiante.</span></button>
    </div>`);

  document.querySelectorAll(".plus[data-at]").forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>levelUp(b.dataset.at);
  });
  bindMerchant();
  bindSwap();
  document.getElementById("descend").onclick=()=>{ G.floor++; screenMap(); };
}

function levelCost(){ return Math.round(70*Math.pow(1.13,G.player.levelsBought)); }
function derivedHint(k){
  const a=G.player.attr;
  if(k==="vit") return `HP ${maxHP(a)}`;
  if(k==="fol") return `AP ${maxAP(a)} · postura ${maxPoise(a)}`;
  if(k==="fe")  return `frasco cura ${flaskHeal(a)}`;
  if(k==="int"||k==="fe") return `foco ${maxFoco(a)}`;
  const w=WEAPONS[G.player.weaponId];
  if(w.scale[k]) return `arma escala ${k.toUpperCase()} ${w.scale[k]}`;
  return "";
}
function levelUp(k){
  const cost=levelCost();
  if(G.icor<cost) return;
  G.icor-=cost; G.player.attr[k]++; G.player.levelsBought++;
  const p=G.player; p.hp=Math.min(p.hp,maxHP(p.attr)); if(k==="vit")p.hp=maxHP(p.attr);
  p.foco=maxFoco(p.attr);
  renderWane();
}

function merchantBlock(){
  return `<div class="hr"></div>
    <div class="fl-lbl">A Mão Trêmula · mercador</div>
    <p class="flavor" style="font-size:14px;margin-bottom:8px">Uma mão sai da parede. Não perguntes de quem.</p>
    <div class="nodegrid two">
      <button class="node" data-buy="flask" ${G.icor<90||G.player.flaskMax>=5?"disabled":""}>
        <div class="nt disp"><span class="ic-dot d-merchant"></span>Carga de Frasco +1</div>
        <div class="nd">Aumenta o máximo do Frasco de Âmago. · 90◈</div></button>
      <button class="node" data-buy="weapon:malho" ${G.icor<110||G.player.invWeapons.includes("malho")?"disabled":""}>
        <div class="nt disp"><span class="ic-dot d-merchant"></span>Malho do Ossuário</div>
        <div class="nd">Maça brutal, escala FOR A. · 110◈</div></button>
    </div>`;
}
function bindMerchant(){
  document.querySelectorAll(".node[data-buy]").forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>{
      const what=b.dataset.buy;
      if(what==="flask"){ G.icor-=90; G.player.flaskMax++; G.player.flask++; toast("Frasco aprimorado."); }
      else if(what.startsWith("weapon:")){ const id=what.split(":")[1]; G.icor-=110; G.player.invWeapons.push(id); toast("Adquirido: "+WEAPONS[id].name); }
      renderWane();
    };
  });
}

function swapWeaponBlock(){
  if(G.player.invWeapons.length<=1) return "";
  const opts=G.player.invWeapons.map(id=>{
    const w=WEAPONS[id], eq=id===G.player.weaponId;
    return `<button class="node ${eq?'done':''}" data-swap="${id}" ${eq?"disabled":""} style="margin-bottom:6px">
      <div class="nt disp">${eq?"⚔ ":""}${w.name} <span class="dim" style="font-size:12px">· ${w.kind}</span></div>
      <div class="nd">${Object.entries(w.scale).map(([s,g])=>s.toUpperCase()+" "+g).join(" · ")} — ${w.desc}</div>
    </button>`;
  }).join("");
  return `<div class="fl-lbl">Arsenal</div>${opts}`;
}
function bindSwap(){
  document.querySelectorAll(".node[data-swap]").forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>{ G.player.weaponId=b.dataset.swap; toast("Empunhas "+WEAPONS[b.dataset.swap].name); renderWane(); };
  });
}

/* ============================================================
                        CHEFE
   ============================================================ */
function screenBossIntro(){
  const fl=G.map[G.floor];
  const foe=FOES[fl.foe];
  render(`
    <div class="epitaph" style="padding-top:8vh">
      <div class="tag" style="margin-bottom:18px">Vigília do Claustro</div>
      <h1 class="disp" style="font-size:clamp(26px,6vw,44px);color:var(--bone)">${foe.name}</h1>
      <p class="line flavor" style="max-width:480px">${foe.flavor}</p>
      <div style="max-width:320px;margin:20px auto 0">
        <button class="btn danger gold" id="fight"><span class="k disp">ENFRENTAR</span>
          <span class="sub">Não há como recuar. Nunca houve.</span></button>
      </div>
    </div>`);
  document.getElementById("fight").onclick=()=>startCombat(fl.foe,false);
}

function victoryScreen(){
  render(`
    <div class="epitaph">
      <div class="candle"></div>
      <div class="word win disp" style="font-size:clamp(38px,10vw,80px)">VIGÍLIA<br>QUEBRADA</div>
      <p class="line flavor">
        Sepulcra cai, e por um instante o Claustro fica em silêncio — o primeiro em eras.
        O trono encharcado continua vazio. Ele espera, paciente, que subas o resto do caminho.
      </p>
      <p class="center flavor" style="color:var(--ichor)">Fim do vertical slice. O que vem depois — o Soberano, o trono, a escolha — é o jogo por construir.</p>
      <div style="max-width:320px;margin:24px auto 0">
        <button class="btn gold" id="sum"><span class="k disp">VER O RUN</span></button>
      </div>
    </div>`);
  document.getElementById("sum").onclick=()=>screenSummary(true);
}

function screenSummary(won){
  const p=G.player;
  const rows=[
    ["Desfecho", won?"Vigília quebrada":"Run encerrado"],
    ["Vestígio", p.name],
    ["Arma final", WEAPONS[p.weaponId].name],
    ["Abates", G.kills],
    ["Mortes", G.deaths],
    ["Níveis comprados", p.levelsBought],
    ["Icor não gasto", G.icor+" ◈"],
  ].map(([k,v])=>`<div><span>${k}</span><b class="ichor">${v}</b></div>`).join("");
  render(`
    <div class="epitaph" style="padding-top:8vh">
      <h2 class="disp ${won?'ichor':''}">${won?"A descida, por hoje, chega ao fim.":"O Claustro fica com o resto."}</h2>
      <div class="runrec">${rows}</div>
      <div style="max-width:320px;margin:20px auto 0">
        <button class="btn gold" id="again"><span class="k disp">NOVO VESTÍGIO</span></button>
        <button class="btn" id="title"><span class="k disp faint">TÍTULO</span></button>
      </div>
    </div>`);
  document.getElementById("again").onclick=screenSelect;
  document.getElementById("title").onclick=screenTitle;
}

/* ---------------- BOOT ---------------- */
screenTitle();
</script>
</body>
</html>
